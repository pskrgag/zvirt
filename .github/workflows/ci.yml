name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Enable KVM access
        run: |
          ls -l /dev/kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Check Formatting
        run: zig fmt --check build.zig test_runner.zig src test_initfs

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just cpio arping

      - name: Build test initrds
        run: just initrds

      - name: Setup tap
        run: just tap

      - name: Run Debug Tests
        timeout-minutes: 10
        run: zig build test -Dci=true

      - name: Run Tsan Tests
        timeout-minutes: 10
        run: zig build test -Dtsan=true -Dci=true

      - name: Run Release Tests
        timeout-minutes: 10
        run: zig build test --release=fast -Dci=true
